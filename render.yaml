services:
  - type: web
    name: drishti-vision-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render free tier: 512MB RAM, 0.1 CPU
    # Upgrade to 'starter' for more RAM if models run out of memory
    plan: free
    envVars:
      - key: PORT
        value: 7860
      - key: GEMINI_API_KEY
        sync: false   # Set this manually in the Render dashboard → Environment
